<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>GlassNote AI</title>

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="GlassNote AI">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GlassNote">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0052CC">
    <meta name="description" content="Beautiful markdown notes with AI assistance">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX CSS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <!-- html2pdf.js for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
      /* Notion-inspired base with iOS 26 subtle glass accents */
      * {
        box-sizing: border-box;
      }

      /* iOS-specific optimizations */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /* Prevent iOS Safari bounce/overscroll */
      html, body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, 'Apple Color Emoji', Arial, sans-serif, 'Segoe UI Emoji', 'Segoe UI Symbol';
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Safe area insets for notch/home indicator */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Better touch targets for iOS (minimum 44x44px) */
      button, a, input[type="button"], input[type="submit"] {
        min-height: 44px;
        min-width: 44px;
      }

      /* Prevent text size adjustment on iOS */
      html {
        -webkit-text-size-adjust: 100%;
      }

      /* Selection colors from design system */
      ::selection {
        background: rgba(0, 82, 204, 0.2);
        color: inherit;
      }

      /* Focus styles */
      :focus-visible {
        outline: 2px solid rgba(0, 82, 204, 0.4);
        outline-offset: 2px;
      }

      /* Notion-style minimal scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.25);
        border: 3px solid transparent;
        background-clip: padding-box;
      }

      /* Dark mode scrollbar */
      .dark ::-webkit-scrollbar-thumb,
      [data-theme="dark"] ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      .dark ::-webkit-scrollbar-thumb:hover,
      [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
        border: 3px solid transparent;
        background-clip: padding-box;
      }

      /* Textarea and input resets */
      textarea, input {
        font-family: inherit;
      }
      textarea:focus, input:focus {
        outline: none;
      }

      /* Smooth transitions */
      * {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      /* Prose adjustments for better reading */
      .prose {
        --tw-prose-body: #37352f;
        --tw-prose-headings: #37352f;
      }
      .prose-invert {
        --tw-prose-body: rgba(255, 255, 255, 0.9);
        --tw-prose-headings: rgba(255, 255, 255, 0.95);
      }
    </style>
    <script type="module" src="/index.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
