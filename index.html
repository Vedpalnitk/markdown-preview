<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlassNote AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX CSS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <!-- html2pdf.js for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
      body {
        font-family: 'SF Pro Display', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden; /* App handles scrolling */
      }
      /* Liquid glass button system (shared across light/dark themes) */
      .liquid-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        overflow: hidden;
        isolation: isolate;
        border-radius: 999px;
        padding: 10px 14px;
        backdrop-filter: blur(18px) saturate(1.15);
        transition: transform 180ms ease, box-shadow 220ms ease, border-color 180ms ease, background 180ms ease, opacity 180ms ease;
        box-shadow: 0 14px 36px -22px rgba(0, 0, 0, 0.55);
      }
      .liquid-btn::before {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 999px;
        background: radial-gradient(circle at 26% 22%, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0));
        opacity: 0.5;
        pointer-events: none;
      }
      .liquid-btn::after {
        display: none;
      }
      .liquid-btn:hover {
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 18px 46px -26px rgba(0, 0, 0, 0.6);
      }
      .liquid-btn-dark:hover {
        background: linear-gradient(150deg, rgba(22, 36, 68, 0.66), rgba(8, 16, 32, 0.82));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          inset 0 -14px 22px rgba(0, 0, 0, 0.36),
          0 26px 70px -32px rgba(0, 0, 0, 0.76);
      }
      .liquid-btn:active {
        transform: translateY(1px) scale(0.98);
      }
      .liquid-btn-icon {
        padding: 8px;
      }
      .liquid-btn-pill {
        padding: 12px 20px;
      }
      .liquid-btn-light {
        background: rgba(255, 255, 255, 0.7);
        color: #0b1b40;
        border: 1px solid rgba(255, 255, 255, 0.55);
      }
      .liquid-btn-dark {
        background: rgba(12, 18, 32, 0.68);
        color: #f9fbff;
        border: none;
        box-shadow: 0 18px 48px -26px rgba(0, 0, 0, 0.68);
      }
      .liquid-btn-dark::before {
        background: radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
        opacity: 0.58;
      }
      .liquid-btn-dark::after {
        display: none;
      }
      .liquid-btn-dark:hover {
        background: rgba(16, 26, 46, 0.72);
        box-shadow: 0 20px 52px -30px rgba(0, 0, 0, 0.72);
      }
      /* Segmented liquid glass pill (reference-matched) */
      .liquid-segmented {
        position: relative;
        display: inline-flex;
        align-items: stretch;
        gap: 1px;
        padding: 8px;
        border-radius: 999px;
        background: linear-gradient(145deg, rgba(32, 42, 120, 0.62), rgba(12, 22, 56, 0.66));
        border: 1px solid rgba(255, 255, 255, 0.32);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.42),
          inset 0 -14px 28px rgba(0, 0, 0, 0.28),
          0 26px 70px -30px rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(26px) saturate(1.35);
        isolation: isolate;
        overflow: hidden;
      }
      .liquid-segmented::before {
        content: "";
        position: absolute;
        inset: 2px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          inset 0 -10px 20px rgba(0, 0, 0, 0.2);
        pointer-events: none;
      }
      .liquid-segmented::after {
        content: "";
        position: absolute;
        inset: -10% -35% 40% 55%;
        background: linear-gradient(110deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0));
        transform: rotate(-8deg);
        opacity: 0.75;
        pointer-events: none;
      }
      .liquid-segment {
        position: relative;
        min-width: 86px;
        padding: 14px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: linear-gradient(150deg, rgba(62, 92, 200, 0.42), rgba(22, 36, 90, 0.62));
        color: #f9fdff;
        text-align: center;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.48),
          inset 0 -16px 32px rgba(0, 0, 0, 0.28),
          0 18px 50px -28px rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(10px) saturate(1.2);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
        transition: transform 140ms ease, box-shadow 200ms ease, background 200ms ease, opacity 180ms ease;
        isolation: isolate;
      }
      .liquid-segment::before {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
        opacity: 0.8;
        pointer-events: none;
      }
      .liquid-segment:hover {
        transform: translateY(-1px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 -18px 34px rgba(0, 0, 0, 0.32),
          0 24px 70px -32px rgba(0, 0, 0, 0.78);
      }
      .liquid-segment:active {
        transform: translateY(1px) scale(0.99);
      }
      .liquid-segment[data-active="true"] {
        background: linear-gradient(150deg, rgba(82, 112, 220, 0.52), rgba(30, 46, 120, 0.78));
        opacity: 0.98;
      }
      .liquid-segment-label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      /* Custom Scrollbar for Glassy feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.5);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.8);
      }
    </style>
    <script type="module" src="/index.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
