<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A8CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow32">
      <feDropShadow dx="0" dy="1.6" stdDeviation="0.96" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="6.4" fill="url(#grad32)"/>

  <!-- Glass note icon -->
  <g transform="translate(6.4, 6.4)">
    <!-- Note page -->
    <rect x="3.2" y="1.6" width="12.8" height="16" rx="0.96"
          fill="white" opacity="0.95" filter="url(#shadow32)"/>

    <!-- Lines on note -->
    <line x1="4.8" y1="4.8" x2="14.4" y2="4.8"
          stroke="#0052CC" stroke-width="0.32" opacity="0.6"/>
    <line x1="4.8" y1="8" x2="14.4" y2="8"
          stroke="#0052CC" stroke-width="0.32" opacity="0.6"/>
    <line x1="4.8" y1="11.2" x2="12.16" y2="11.2"
          stroke="#0052CC" stroke-width="0.32" opacity="0.6"/>

    <!-- Glass effect overlay -->
    <rect x="3.2" y="1.6" width="12.8" height="8" rx="0.96"
          fill="white" opacity="0.2"/>
  </g>
</svg>