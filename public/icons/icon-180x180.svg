<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad180" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A8CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow180">
      <feDropShadow dx="0" dy="9" stdDeviation="5.3999999999999995" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="180" height="180" rx="36" fill="url(#grad180)"/>

  <!-- Glass note icon -->
  <g transform="translate(36, 36)">
    <!-- Note page -->
    <rect x="18" y="9" width="72" height="90" rx="5.3999999999999995"
          fill="white" opacity="0.95" filter="url(#shadow180)"/>

    <!-- Lines on note -->
    <line x1="27" y1="27" x2="81" y2="27"
          stroke="#0052CC" stroke-width="1.8" opacity="0.6"/>
    <line x1="27" y1="45" x2="81" y2="45"
          stroke="#0052CC" stroke-width="1.8" opacity="0.6"/>
    <line x1="27" y1="62.99999999999999" x2="68.4" y2="62.99999999999999"
          stroke="#0052CC" stroke-width="1.8" opacity="0.6"/>

    <!-- Glass effect overlay -->
    <rect x="18" y="9" width="72" height="45" rx="5.3999999999999995"
          fill="white" opacity="0.2"/>
  </g>
</svg>