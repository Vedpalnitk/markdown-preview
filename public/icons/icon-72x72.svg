<?xml version="1.0" encoding="UTF-8"?>
<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad72" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A8CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow72">
      <feDropShadow dx="0" dy="3.6" stdDeviation="2.16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="72" height="72" rx="14.4" fill="url(#grad72)"/>

  <!-- Glass note icon -->
  <g transform="translate(14.4, 14.4)">
    <!-- Note page -->
    <rect x="7.2" y="3.6" width="28.8" height="36" rx="2.16"
          fill="white" opacity="0.95" filter="url(#shadow72)"/>

    <!-- Lines on note -->
    <line x1="10.799999999999999" y1="10.799999999999999" x2="32.4" y2="10.799999999999999"
          stroke="#0052CC" stroke-width="0.72" opacity="0.6"/>
    <line x1="10.799999999999999" y1="18" x2="32.4" y2="18"
          stroke="#0052CC" stroke-width="0.72" opacity="0.6"/>
    <line x1="10.799999999999999" y1="25.2" x2="27.36" y2="25.2"
          stroke="#0052CC" stroke-width="0.72" opacity="0.6"/>

    <!-- Glass effect overlay -->
    <rect x="7.2" y="3.6" width="28.8" height="18" rx="2.16"
          fill="white" opacity="0.2"/>
  </g>
</svg>