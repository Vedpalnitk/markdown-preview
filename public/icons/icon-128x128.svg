<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad128" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A8CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow128">
      <feDropShadow dx="0" dy="6.4" stdDeviation="3.84" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="128" height="128" rx="25.6" fill="url(#grad128)"/>

  <!-- Glass note icon -->
  <g transform="translate(25.6, 25.6)">
    <!-- Note page -->
    <rect x="12.8" y="6.4" width="51.2" height="64" rx="3.84"
          fill="white" opacity="0.95" filter="url(#shadow128)"/>

    <!-- Lines on note -->
    <line x1="19.2" y1="19.2" x2="57.6" y2="19.2"
          stroke="#0052CC" stroke-width="1.28" opacity="0.6"/>
    <line x1="19.2" y1="32" x2="57.6" y2="32"
          stroke="#0052CC" stroke-width="1.28" opacity="0.6"/>
    <line x1="19.2" y1="44.8" x2="48.64" y2="44.8"
          stroke="#0052CC" stroke-width="1.28" opacity="0.6"/>

    <!-- Glass effect overlay -->
    <rect x="12.8" y="6.4" width="51.2" height="32" rx="3.84"
          fill="white" opacity="0.2"/>
  </g>
</svg>