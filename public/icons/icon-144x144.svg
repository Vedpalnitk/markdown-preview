<?xml version="1.0" encoding="UTF-8"?>
<svg width="144" height="144" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad144" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A8CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow144">
      <feDropShadow dx="0" dy="7.2" stdDeviation="4.32" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="144" height="144" rx="28.8" fill="url(#grad144)"/>

  <!-- Glass note icon -->
  <g transform="translate(28.8, 28.8)">
    <!-- Note page -->
    <rect x="14.4" y="7.2" width="57.6" height="72" rx="4.32"
          fill="white" opacity="0.95" filter="url(#shadow144)"/>

    <!-- Lines on note -->
    <line x1="21.599999999999998" y1="21.599999999999998" x2="64.8" y2="21.599999999999998"
          stroke="#0052CC" stroke-width="1.44" opacity="0.6"/>
    <line x1="21.599999999999998" y1="36" x2="64.8" y2="36"
          stroke="#0052CC" stroke-width="1.44" opacity="0.6"/>
    <line x1="21.599999999999998" y1="50.4" x2="54.72" y2="50.4"
          stroke="#0052CC" stroke-width="1.44" opacity="0.6"/>

    <!-- Glass effect overlay -->
    <rect x="14.4" y="7.2" width="57.6" height="36" rx="4.32"
          fill="white" opacity="0.2"/>
  </g>
</svg>