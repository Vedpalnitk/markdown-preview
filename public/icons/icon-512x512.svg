<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A8CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow512">
      <feDropShadow dx="0" dy="25.6" stdDeviation="15.36" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="102.4" fill="url(#grad512)"/>

  <!-- Glass note icon -->
  <g transform="translate(102.4, 102.4)">
    <!-- Note page -->
    <rect x="51.2" y="25.6" width="204.8" height="256" rx="15.36"
          fill="white" opacity="0.95" filter="url(#shadow512)"/>

    <!-- Lines on note -->
    <line x1="76.8" y1="76.8" x2="230.4" y2="76.8"
          stroke="#0052CC" stroke-width="5.12" opacity="0.6"/>
    <line x1="76.8" y1="128" x2="230.4" y2="128"
          stroke="#0052CC" stroke-width="5.12" opacity="0.6"/>
    <line x1="76.8" y1="179.2" x2="194.56" y2="179.2"
          stroke="#0052CC" stroke-width="5.12" opacity="0.6"/>

    <!-- Glass effect overlay -->
    <rect x="51.2" y="25.6" width="204.8" height="128" rx="15.36"
          fill="white" opacity="0.2"/>
  </g>
</svg>